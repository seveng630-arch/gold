name: Update DELANOGOLD Market Data

on:
  schedule:
    # Berjalan otomatis pada 08:35, 13:30, 17:00, dan 21:30 WIB (UTC+7)
    - cron: '35 1 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # Tombol manual untuk uji coba kapan saja

permissions:
  contents: write

jobs:
  build-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests beautifulsoup4 feedparser

      - name: Run Quantitative & Market Data Engine
        run: python scripts/fetch_gold_data.py

      - name: Commit and push updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/market_bundle.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update real-time & quant gold data" && git push)
